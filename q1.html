<!DOCTYPE html>

<html lang="en">

<head>
<meta charset="UTF-8">
<title>Code Relay - Question 1</title>

<script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>

<style>

body{
font-family:Arial;
background:#f4f6f9;
margin:0;
padding:20px;
}

.page{
max-width:1000px;
margin:auto;
}

.problem-box{
background:white;
padding:20px;
border-radius:8px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

pre{
background:#272822;
color:#f8f8f2;
padding:15px;
border-radius:5px;
overflow-x:auto;
}

#editor{
height:350px;
border:1px solid #ccc;
margin-top:20px;
}

button{
padding:10px 15px;
margin-top:15px;
margin-right:10px;
border:none;
border-radius:5px;
cursor:pointer;
font-weight:bold;
}

#runBtn{
background:#f39c12;
color:white;
}

#submitBtn{
background:#3498db;
color:white;
}

.timer{
font-weight:bold;
color:red;
}

#outputBox{
background:black;
color:#00ff00;
padding:10px;
margin-top:15px;
min-height:80px;
white-space:pre-wrap;
}

</style>

</head>

<body>

<div class="page">

<div class="problem-box">

<h2>Question 1 – Easy</h2>

<p><b>Problem:</b> Refactor the following code without changing its output.</p>

<pre>
Input:
["flower","flow","flight"]

Expected Output:
fl
</pre>

<p><b>Time Remaining:</b>
<span id="timer" class="timer">20m 00s</span>
</p>

<h3>Write your code</h3>

<div id="editor"></div>

<button id="runBtn" onclick="runCode()">Run Code</button>

<h3>Output</h3>
<pre id="outputBox">Output will appear here...</pre>

<button id="submitBtn" onclick="submitCode()">Submit Code</button>

</div>
</div>

<script src="https://unpkg.com/monaco-editor@0.34.1/min/vs/loader.js"></script>

<script>

/* Monaco Editor */

require.config({ paths: { vs: 'https://unpkg.com/monaco-editor@0.34.1/min/vs' }});

require(['vs/editor/editor.main'], function () {

window.editor = monaco.editor.create(document.getElementById('editor'), {

value:`def longestCommonPrefix(strs):

    prefix = strs[0]

    for i in range(len(prefix)):
        for word in strs:
            if i >= len(word) or word[i] != prefix[i]:
                return prefix[:i]

    return prefix

print(longestCommonPrefix(["flower","flow","flight"]))`,

language:"python",
theme:"vs-dark"

});

});

/* Pyodide */

let pyodide;

async function loadPython(){
pyodide = await loadPyodide();
}

loadPython();

/* Test Cases */

let tests = [

{input:'["flower","flow","flight"]',expected:"fl"},
{input:'["dog","racecar","car"]',expected:""},
{input:'["interview","internet"]',expected:"inter"}

];

let allPassed=false;

/* Run Code */

async function runCode(){

let code = editor.getValue();

let passed = 0;
let outputText = "";

for(let t of tests){

try{

let runCode = code.replace(
/print\(.*\)/,
`print(longestCommonPrefix(${t.input}))`
);

let result = await pyodide.runPythonAsync(runCode);

let out = result ? result.toString().trim() : "";

if(out === t.expected){

passed++;
outputText += `Test Passed → ${t.input} → ${out}\n`;

}
else{

outputText += `Test Failed → ${t.input}\nExpected: ${t.expected}\nGot: ${out}\n\n`;

}

}

catch(err){

outputText += err + "\n";

}

}

document.getElementById("outputBox").textContent = outputText;

if(passed === tests.length){

allPassed=true;
alert("All Test Cases Passed!");

}
else{

allPassed=false;
alert("Some Test Cases Failed");

}

}

</script>

<!-- Firebase submission -->

<script type="module">

import { db } from "./firebase.js";

import { collection, addDoc }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

window.submitCode = async function(){

if(!allPassed){

alert("You must pass all test cases before submitting!");

return;

}

let code = editor.getValue();

let team = localStorage.getItem("teamName") || "unknown";

try{

await addDoc(collection(db,"submissions"),{

team:team,
question:"Q1",
code:code,
time:new Date()

});

alert("Code submitted successfully!");

}
catch(e){

alert("Submission failed");
console.error(e);

}

}

</script>

<script>

/* Timer */

function startTimer(minutes){

let timeLeft=minutes*60;

const timerDisplay=document.getElementById("timer");

const countdown=setInterval(function(){

let mins=Math.floor(timeLeft/60);
let secs=timeLeft%60;

if(secs<10) secs="0"+secs;

timerDisplay.textContent=mins+"m "+secs+"s";

timeLeft--;

if(timeLeft<0){

clearInterval(countdown);
alert("Time's Up!");

}

},1000);

}

startTimer(20);

</script>

</body>
</html>
