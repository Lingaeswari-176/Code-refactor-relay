<!DOCTYPE html>

<html lang="en">

<head>
<meta charset="UTF-8">
<title>Code Refactor Relay - Login</title>

<style>

body{
font-family:Arial;
background:#f4f6f9;
margin:0;
padding:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.login-box{
background:white;
padding:40px;
border-radius:8px;
box-shadow:0 0 15px rgba(0,0,0,0.1);
width:350px;
text-align:center;
}

h1{
margin-bottom:20px;
}

input{
width:100%;
padding:10px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
font-size:16px;
}

button{
width:100%;
padding:10px;
background:#3498db;
color:white;
border:none;
border-radius:5px;
font-size:16px;
cursor:pointer;
font-weight:bold;
}

button:hover{
background:#2980b9;
}

.error{
color:red;
margin-top:10px;
}

</style>

</head>

<body>

<div class="login-box">

<h1>Code Refactor Relay</h1>

<p>Team Login</p>

<input type="text" id="teamName" placeholder="Enter Team Name">

<input type="password" id="password" placeholder="Enter Password">

<button onclick="login()">Start Contest</button>

<p id="errorMsg" class="error"></p>

</div>

<script>

function login(){

let team = document.getElementById("teamName").value.trim();
let pass = document.getElementById("password").value;

let correctPassword = "code@123";

if(team === ""){
document.getElementById("errorMsg").innerText = "Enter team name";
return;
}

if(pass === correctPassword){

localStorage.setItem("teamName",team);

window.location.href = "q1.html";

}
else{

document.getElementById("errorMsg").innerText = "Wrong password";

}

}

</script>

</body>
</html>
